<div class="p-6 bg-slate-50 min-h-screen">
    <!-- Encabezado -->
    <div class="mb-6 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                🧠 Análisis de Evolución Clínica (IA)
            </h1>
            <p class="text-slate-500 text-sm mt-1">
                Consulta la evolución clínica e historial de los tratamientos odontológicos con Gemini AI.
            </p>
        </div>
    </div>

    <!-- Formulario -->
    <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm mb-6">
        <div class="flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-1">
                <label class="block text-sm font-semibold text-slate-700 mb-2">
                    ID del Paciente
                </label>
                <input type="number" [(ngModel)]="pacienteId" placeholder="Ingrese ID del paciente"
                    class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-pink-500" />
            </div>
            <button (click)="generarAnalisis()" [disabled]="cargando"
                class="px-6 py-2.5 bg-pink-600 hover:bg-pink-700 disabled:bg-pink-300 text-white font-semibold rounded-xl transition-colors flex items-center gap-2">
                <span *ngIf="cargando" class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></span>
                {{ cargando ? 'Analizando...' : 'Generar Análisis' }}
            </button>
        </div>
    </div>

    <!-- Error -->
    <div *ngIf="errorMsg" class="p-4 bg-red-50 text-red-600 rounded-xl mb-6 text-sm font-medium">
        {{ errorMsg }}
    </div>

    <!-- Resultados -->
    <div *ngIf="analisis" class="space-y-6">
        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
            <h2 class="text-lg font-bold text-slate-800 mb-3">📄 Resumen de Evolución</h2>
            <p class="text-slate-600 leading-relaxed">{{ analisis.resumen_evolucion }}</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                <h3 class="text-md font-bold text-indigo-600 mb-3">📌 Puntos Clave</h3>
                <ul class="space-y-2">
                    <li *ngFor="let punto of analisis.puntos_clave" class="text-slate-600 text-sm">
                        • {{ punto }}
                    </li>
                </ul>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                <h3 class="text-md font-bold text-emerald-600 mb-3">💡 Recomendaciones</h3>
                <ul class="space-y-2">
                    <li *ngFor="let rec of analisis.recomendaciones" class="text-slate-600 text-sm">
                        ✓ {{ rec }}
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
